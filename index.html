nav span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}button,select{font:inherit;color:inherit;border:1px solid #8d7a57;border-radius:6px;background:#203b3d;padding:.35rem .65rem}button{cursor:pointer}button:disabled{opacity:.55;cursor:default}button:focus-visible,select:focus-visible{outline:2px solid #e6c690;outline-offset:2px}

#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:2rem;background:#102225;z-index:1}#loading[hidden],[hidden]{display:none!important}
dialog{width:min(460px,calc(100% - 2rem));background:#142b2e;color:inherit;border:1px solid #968160;border-radius:12px;padding:1.35rem}dialog::backdrop{background:#080e11bc}dialog h1{font:600 1.45rem Georgia,serif;margin:0 0 1rem}dialog label{display:block;margin:.8rem 0 .35rem}dialog select{max-width:100%;width:100%}.actions{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:.85rem}#saveMsg{margin:.85rem 0 0;min-height:1.4em;color:#e3cdab}

 <input type="file" id="saveFile" accept=".json,application/json" hidden>
 <p id="saveMsg" role="status"></p>
</dialog>

<script type="application/octet-stream" data-chapter="20" data-save-key="napoli1950_l20_quarantotto_casse_v1" data-title="Le quarantotto casse" data-src="livello-20.html"></script>

<script>
(() => {
 const $=id=>document.getElementById(id);
 const chapters=[...document.querySelectorAll('script[data-chapter]')];
 const titles=chapters.map(node=>node.dataset.title);
 const keys=chapters.map(node=>node.dataset.saveKey);
 const end=chapters.length-1;
 const storageKey='napoli1950_edizione_offline_v1';
 const validDataKey=key=>/^napoli1950_[a-z0-9_]+$/i.test(key)&&key!==storageKey;
 const initial=()=>({version:1,current:0,unlocked:0,data:{}});
 function validate(raw){
  if(!raw||raw.version!==1||!Number.isInteger(raw.current)||!Number.isInteger(raw.unlocked)||
    raw.current<0||raw.unlocked<raw.current||raw.unlocked>end||!raw.data||
    typeof raw.data!=='object'||Array.isArray(raw.data))throw new Error('Salvataggio non valido per questa edizione.');
  const data=Object.fromEntries(Object.entries(raw.data).filter(([key,value])=>validDataKey(key)&&typeof value==='string'&&value.length<100000));
  return {version:1,current:raw.current,unlocked:raw.unlocked,data};
 }
 let state=initial(), autoSave=true, frame=null, request=0, busy=false;
 try{
  const previous=localStorage.getItem(storageKey);
  if(previous)state=validate(JSON.parse(previous));
 }catch{}
 function persist(){
  try{localStorage.setItem(storageKey,JSON.stringify(state));autoSave=true;}
  catch{autoSave=false;}
 }
 function setStatus(message=''){
  $('saveMsg').textContent=message||(autoSave?'I progressi si salvano automaticamente.':'Per conservare i progressi, esporta il salvataggio.');
 }
 function update(){
  const index=state.current;
  $('chapter').textContent=index===0?'Prologo · Via Toledo':'Livello '+index+' · '+titles[index];
  $('next').hidden=busy||index===0||index>=end||state.unlocked<=index;
  $('next').textContent='Livello '+(index+1)+' →';
  $('chapterSelect').replaceChildren(...titles.slice(0,state.unlocked+1).map((title,i)=>
    new Option(i===0?'Prologo · '+title:i+' · '+title,String(i),false,i===index)));
  setStatus();
 }
 const levelStorage=Object.freeze({
  getItem(key){return Object.hasOwn(state.data,key)?state.data[key]:null;},
  setItem(key,value){
   if(!validDataKey(key))return;
   state.data[key]=String(value);
   const index=keys.indexOf(key);
   let unlocked=false;
   if(index>0&&index===state.current&&index<end&&state.unlocked===index){
    try{unlocked=JSON.parse(value).solved===true;}catch{}
    if(unlocked)state.unlocked=index+1;
   }
   persist();
   if(unlocked)update();
  },
  removeItem(key){if(validDataKey(key)){delete state.data[key];persist();}}
 });
 const bridge=Object.freeze({
  storage:levelStorage,
  advance(index){
   if(busy||state.current!==index||index>=end)return;
   if(index===0)state.unlocked=Math.max(1,state.unlocked);
   if(state.unlocked>index)openLevel(index+1);
  },
  mayAdvance(index){return !busy&&state.current===index&&index>0&&index<end&&state.unlocked>index;}
 });
 Object.defineProperty(window,'napoliCampaign',{value:bridge});
 async function unpack(node){
  const response=await fetch(node.dataset.src);
  if(!response.ok)throw new Error('HTTP '+response.status);
  return response.text();
 }
 async function openLevel(index){
  if(!Number.isInteger(index)||index<0||index>state.unlocked)return;
  const token=++request;
  busy=true;
  $('next').hidden=true;
  $('loading').hidden=false;
  $('loading').textContent='Apertura di '+titles[index]+'…';
  try{
   const html=await unpack(chapters[index]);
   if(token!==request)return;
   const nextFrame=document.createElement('iframe');
   nextFrame.title=index===0?'Prologo · Via Toledo':'Livello '+index+' · '+titles[index];
   state.current=index;
   persist();
   nextFrame.addEventListener('load',()=>{
    if(token!==request)return;
    busy=false;
    $('loading').hidden=true;
    update();
   },{once:true});
   nextFrame.srcdoc=html;
   frame?.remove();
   frame=nextFrame;
   $('stage').append(frame);
   update();
  }catch{
   if(token!==request)return;
   busy=false;
   $('loading').textContent='Non è stato possibile caricare il capitolo. Controlla la connessione, poi ricarica la pagina.';
   update();
  }
 }
 $('next').onclick=()=>bridge.advance(state.current);
 $('menuBtn').onclick=()=>{update();$('menu').showModal();};
 $('resume').onclick=()=>$('menu').close();
 $('openChapter').onclick=()=>{const index=Number($('chapterSelect').value);$('menu').close();if(index!==state.current||!frame)openLevel(index);};
 $('newGame').onclick=()=>{
  if(!confirm('Iniziare una nuova partita? I progressi della partita corrente saranno sostituiti.'))return;
  const preferences=Object.fromEntries(Object.entries(state.data).filter(([key])=>!keys.includes(key)));
  state={...initial(),data:preferences};
  $('menu').close();
  openLevel(0);
 };
 $('exportSave').onclick=()=>{
  const url=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));
  const link=document.createElement('a');
  link.href=url;
  link.download='Napoli1950_salvataggio_'+new Date().toISOString().slice(0,19).replaceAll(':','-')+'.json';
  link.click();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  setStatus('Salvataggio esportato.');
 };
 $('importSave').onclick=()=>$('saveFile').click();
 $('saveFile').onchange=async event=>{
  const file=event.target.files[0];
  event.target.value='';
  if(!file)return;
  try{
   if(file.size>400000)throw new Error('Salvataggio non valido.');
   const imported=validate(JSON.parse(await file.text()));
   if((state.unlocked||Object.keys(state.data).some(key=>keys.includes(key)))&&
     !confirm('Caricare questo salvataggio al posto della partita corrente?'))return;
   state=imported;
   $('menu').close();
   await openLevel(state.current);
  }catch{setStatus('Il file selezionato non è un salvataggio valido di Napoli 1950.');}
 };
 persist();
 openLevel(state.current);
})();
</script>
</body>
